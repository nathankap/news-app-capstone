{% extends 'base.html' %}

{% block title %}Change Price{% endblock %}

{% block content %}
<div class="card">
<h2>Change Product Price</h2>

{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <label>Product name:</label>
    <input type="text" name="product" required><br><br>

    <label>New price:</label>
    <input type="text" name="new_price" required><br><br>

    <button type="submit">Update Price</button>
</form>

<div class="actions">
    <a href="{% url 'eCommerce:products_list' %}">
        <button class="button-muted">Back to Catalog</button>
    </a>

    <a href="{% url 'eCommerce:product_page' %}">
        <button class="button-muted">Search Product</button>
    </a>
</div>
</div>
{% endblock %}
