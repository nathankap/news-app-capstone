{% extends 'base.html' %}

{% block title %}My Stores{% endblock %}

{% block content %}
<div class="card">
    <h1>My Stores</h1>
    <div class="actions">
        <a href="{% url 'eCommerce:create_store' %}"><button>Create Store</button></a>
    </div>
    {% if stores %}
        <ul>
            {% for store in stores %}
                <li>
                    <strong>{{ store.name }}</strong><br>
                    {{ store.description }}<br>
                    <a href="{% url 'eCommerce:edit_store' store.id %}"><button>Edit</button></a>
                    <a href="{% url 'eCommerce:delete_store' store.id %}"><button>Delete</button></a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You have not created any stores yet.</p>
    {% endif %}
    <div class="actions">
        <a href="{% url 'eCommerce:products_list' %}"><button class="button-muted">Back to Catalog</button></a>
    </div>
</div>
{% endblock %}
