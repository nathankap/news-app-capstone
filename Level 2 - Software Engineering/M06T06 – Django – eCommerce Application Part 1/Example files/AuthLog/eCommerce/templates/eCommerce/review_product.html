{% extends 'base.html' %}

{% block title %}Review {{ product.name }}{% endblock %}

{% block content %}
<div class="card">
    <h1>Review {{ product.name }}</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label>Rating (1-5):</label>
        <input type="number" name="rating" min="1" max="5" value="5" required><br><br>

        <label>Comment:</label><br>
        <textarea name="comment" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Submit Review</button>
    </form>

    <div class="actions">
        <a href="{% url 'eCommerce:product_detail' product.id %}"><button class="button-muted">Back to Product</button></a>
    </div>
</div>
{% endblock %}
