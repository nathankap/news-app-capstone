{% extends 'base.html' %}

{% block title %}{% if store %}Edit Store{% else %}Create Store{% endif %}{% endblock %}

{% block content %}
<div class="card">
    <h1>{% if store %}Edit Store{% else %}Create Store{% endif %}</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <label>Name:</label><br>
        <input type="text" name="name" value="{{ store.name|default_if_none:'' }}" required><br><br>
        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="40">{{ store.description|default_if_none:'' }}</textarea><br><br>
        <button type="submit">Save</button>
    </form>
    <div class="actions">
        <a href="{% url 'eCommerce:stores_list' %}"><button class="button-muted">Back to Stores</button></a>
    </div>
</div>
{% endblock %}
