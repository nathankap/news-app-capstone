{% extends 'base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="card">
    <h1>Delete Product</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>

    <div class="actions">
        <a href="{% url 'eCommerce:product_detail' product.id %}"><button class="button-muted">No, go back</button></a>
    </div>
</div>
{% endblock %}
