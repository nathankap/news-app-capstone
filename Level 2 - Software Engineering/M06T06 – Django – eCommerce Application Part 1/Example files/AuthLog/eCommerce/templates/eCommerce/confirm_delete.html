<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Delete Product</title>
</head>
<body>
    <h1>Delete Product</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>

    <br>
    <a href="{% url 'eCommerce:product_detail' product.id %}"><button>No, go back</button></a>
</body>
</html>
