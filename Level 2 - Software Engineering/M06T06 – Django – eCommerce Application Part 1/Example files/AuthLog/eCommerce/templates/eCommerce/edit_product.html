{% extends 'base.html' %}

{% block title %}Edit Product{% endblock %}

{% block content %}
<div class="card">
    <h1>Edit Product</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label>Name:</label>
        <input type="text" name="name" value="{{ product.name }}" required><br><br>

        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="40">{{ product.description }}</textarea><br><br>

        <label>Price:</label>
        <input type="text" name="price" value="{{ product.price }}" required><br><br>

        <label>Stock:</label>
        <input type="number" name="stock" value="{{ product.stock }}" required min="0"><br><br>

        <button type="submit">Save Changes</button>
    </form>

    <div class="actions">
        <a href="{% url 'eCommerce:product_detail' product.id %}"><button class="button-muted">Cancel</button></a>
    </div>
</div>
{% endblock %}
