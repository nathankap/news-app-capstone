<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>
    <h2>Register An Account</h2>

    <form method="POST" action="{% url 'grabsomore:register' %}">
        {% csrf_token %}

        <label for="username">Username:</label>
        <input type="text" name="username" required><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" name="password" required><br><br>

        <label>Role:</label><br>
        <input type="radio" id="buyer" name="role" value="buyer" checked>
        <label for="buyer">Buyer</label><br>
        <input type="radio" id="vendor" name="role" value="vendor">
        <label for="vendor">Vendor</label><br><br>

        <button type="submit">Register</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <p>Already have an account? <a href="{% url 'grabsomore:login' %}">Login here</a></p>
</body>
</html>
