{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
    <h2>Login</h2>

    <form method="POST" action="{% url 'grabsomore:login' %}">
        {% csrf_token %}
        <label for="username">Username:</label>
        <input type="text" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" name="password" required><br><br>

        <button type="submit">Login</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="actions">
        <a href="{% url 'grabsomore:request_password_reset' %}" class="button-link button-muted">Forgot your password?</a>
        <p>Don't have an account?
            <a href="{% url 'grabsomore:register' %}">
                <button>Register here</button>
            </a>
        </p>
    </div>
</div>
{% endblock %}
