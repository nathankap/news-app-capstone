<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .product-img { transition: transform .25s ease, filter .25s ease; }
      .product-img:hover { transform: scale(1.06); filter: brightness(1.03); }
      .card:hover { transform: translateY(-4px); transition: transform .2s ease; }
      .card { transition: box-shadow .2s ease; }
      footer .form-control { min-width: 160px; }
      @media (max-width: 576px) {
        footer .form-control { min-width: 120px; }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
      <div class="container">
        <a class="navbar-brand" href="#">My Shop</a>
      </div>
    </nav>

    <main class="container">
      <h1 class="mb-4">Featured Products</h1>

      <div class="row" id="products">
        <!-- 10 product cards -->
        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product1.jpg" class="card-img-top img-fluid product-img" alt="Product 1">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Classic Watch</h5>
              <p class="card-text text-muted">$49.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product2.jpg" class="card-img-top img-fluid product-img" alt="Product 2">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Leather Wallet</h5>
              <p class="card-text text-muted">$24.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product3.jpg" class="card-img-top img-fluid product-img" alt="Product 3">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Running Shoes</h5>
              <p class="card-text text-muted">$79.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product4.jpg" class="card-img-top img-fluid product-img" alt="Product 4">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Scented Candle</h5>
              <p class="card-text text-muted">$12.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product5.jpg" class="card-img-top img-fluid product-img" alt="Product 5">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Bluetooth Speaker</h5>
              <p class="card-text text-muted">$34.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product6.jpg" class="card-img-top img-fluid product-img" alt="Product 6">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Sunglasses</h5>
              <p class="card-text text-muted">$19.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product7.jpg" class="card-img-top img-fluid product-img" alt="Product 7">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Notebook</h5>
              <p class="card-text text-muted">$7.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product8.jpg" class="card-img-top img-fluid product-img" alt="Product 8">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Desk Lamp</h5>
              <p class="card-text text-muted">$29.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product9.jpg" class="card-img-top img-fluid product-img" alt="Product 9">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Coffee Mug</h5>
              <p class="card-text text-muted">$9.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100">
            <img src="images/product10.jpg" class="card-img-top img-fluid product-img" alt="Product 10">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Throw Pillow</h5>
              <p class="card-text text-muted">$15.99</p>
              <div class="mt-auto"><button class="btn btn-primary w-100">Buy</button></div>
            </div>
          </div>
        </div>

      </div>

    </main>

    <footer class="bg-light py-4 mt-5">
      <div class="container d-flex align-items-center">
        <img src="images/logo.png" alt="Logo" class="me-3" style="width:50px;height:50px;object-fit:cover;">
        <form class="row gx-2 gy-2 align-items-center w-100">
          <div class="col">
            <input type="text" class="form-control" placeholder="Full name">
          </div>
          <div class="col">
            <input type="email" class="form-control" placeholder="Email">
          </div>
          <div class="col">
            <input type="tel" class="form-control" placeholder="Phone">
          </div>
          <div class="col-auto">
            <button class="btn btn-success">Send</button>
          </div>
        </form>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
