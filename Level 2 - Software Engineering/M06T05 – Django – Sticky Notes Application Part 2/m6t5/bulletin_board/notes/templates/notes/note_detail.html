<!-- notes/templates/notes/note_detail.html -->
{% extends 'base.html' %}
{% block title %}
    Sticky Notes - {{ note.title }}
{% endblock %}
{% block content %}
    <h2>
        {{ note.title }}
    </h2>
    <p>{{ note.content }}</p>
    <p>Created at: {{ note.created_at }}</p>
    <a href="{% url 'note_update' pk=note.pk %}">Edit Note</a>
    <form method="post" action="{% url 'note_delete' pk=note.pk %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" onclick="return confirm('Are you sure you want to delete this note?');">Delete Note</button>
    </form>
    <a href="{% url 'note_list' %}">Back to Notes</a>
{% endblock %}
