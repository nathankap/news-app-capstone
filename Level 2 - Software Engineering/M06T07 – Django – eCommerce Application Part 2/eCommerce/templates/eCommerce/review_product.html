<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Review {{ product.name }}</title>
</head>
<body>
    <h1>Review {{ product.name }}</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label>Rating (1-5):</label>
        <input type="number" name="rating" min="1" max="5" value="5" required><br><br>

        <label>Comment:</label><br>
        <textarea name="comment" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Submit Review</button>
    </form>

    <br>
    <a href="{% url 'eCommerce:product_detail' product.id %}"><button>Back to Product</button></a>
</body>
</html>
