<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if store %}Edit Store{% else %}Create Store{% endif %}</title>
</head>
<body>
    <h1>{% if store %}Edit Store{% else %}Create Store{% endif %}</h1>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <label>Name:</label><br>
        <input type="text" name="name" value="{{ store.name|default_if_none:'' }}" required><br><br>
        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="40">{{ store.description|default_if_none:'' }}</textarea><br><br>
        <button type="submit">Save</button>
    </form>
    <br>
    <a href="{% url 'eCommerce:stores_list' %}"><button>Back to Stores</button></a>
</body>
</html>
