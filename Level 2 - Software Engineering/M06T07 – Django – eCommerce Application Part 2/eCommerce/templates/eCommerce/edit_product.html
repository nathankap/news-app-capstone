<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Product</title>
</head>
<body>
    <h1>Edit Product</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label>Name:</label>
        <input type="text" name="name" value="{{ product.name }}" required><br><br>

        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="40">{{ product.description }}</textarea><br><br>

        <label>Price:</label>
        <input type="text" name="price" value="{{ product.price }}" required><br><br>

        <label>Stock:</label>
        <input type="number" name="stock" value="{{ product.stock }}" required min="0"><br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>
    <a href="{% url 'eCommerce:product_detail' product.id %}"><button>Cancel</button></a>
</body>
</html>
