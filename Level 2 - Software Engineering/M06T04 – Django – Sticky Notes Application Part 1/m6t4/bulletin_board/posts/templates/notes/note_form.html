<!-- notes/templates/notes/note_form.html -->
{% extends 'base.html' %}
{% block title %}
    Sticky Notes -
    {% if form.instance.pk %}
        Edit
    {% else %}
        Create
    {% endif %}
    Post
{% endblock %}
{% block content %}
    <h2>
        {% if form.instance.pk %}
        Edit
        {% else %}
        Create
        {% endif %}
        Post
    </h2>
    <form method="post"
        action="{% if form.instance.pk %}{% url 'note_update' pk=form.instance.pk %}{% else %}{% url 'note_create' %}{% endif %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Save
        </button>
    </form>
    <a href="{% url 'note_list' %}">Back to Sticky Notes</a>
{% endblock %}
