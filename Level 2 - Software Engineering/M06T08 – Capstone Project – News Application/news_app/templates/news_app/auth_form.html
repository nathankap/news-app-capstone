{% extends 'news_app/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="card auth-card">
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-wrap">
            {{ form.as_p }}
        </div>
        <button type="submit">{{ submit_label }}</button>
    </form>
</section>
{% endblock %}
